title: "My Tech Reco Feed"
description: "似ている新着だけを厳選"
site_url: "https://example.com"
top_k: 10              # 毎回の上位件数
half_life_days: 7      # 新しさの半減期（小さくすると新着を強く優遇）
block_keywords: ["求人", "採用", "セール", "割引", "プログラミングスクール", "駆け出し"]
min_title_len: 12
min_items: 1             # しきい値で減っても最低ここまでは埋める
use_percentile_threshold: true   # データに応じて動的しきい値も使う
percentile_p: 0.70        # 類似度の上位20%を採用する目安（80パーセンタイル）
apply_threshold_on: "final_score" # "similarity" or "final_score"（後述）
min_similarity: 0.10      # コサイン類似度の固定しきい値（0.0〜1.0, nullで無効）
score_threshold: 0.020 # 最終スコア側にしきい値を置く場合だけ使う
profiles:
  - name: default
    feeds_opml: data/feeds.opml
    likes_csv: data/likes.csv
    output_rss: docs/recommended.xml
    title: "Tech Feed"
    description: "技術系のブログからおすすめフィードを生成"
  - name: english tech
    feeds_opml: data/feeds_english.opml
    likes_csv: data/likes_english.csv
    output_rss: docs/recommended-english.xml
    title: "Tech Feed (English)"
    description: "英語記事からおすすめフィードを生成"
    apply_threshold_on: "final_score" # "similarity" or "final_score"（後述）
    score_threshold: 0.120 # 最終スコア側にしきい値を置く場合だけ使う
    language: "ja"
    translation:
      enabled: true
      source_language: "en"
      target_language: "ja"
  - name: space
    feeds_opml: data/feeds_space.opml
    likes_csv: data/likes_space.csv
    output_rss: docs/recommended-space.xml
    title: "Space Tech Feed"
    description: "宇宙関係の記事からおすすめフィードを生成"
    apply_threshold_on: "final_score" # "similarity" or "final_score"（後述）
    score_threshold: 0.015 # 最終スコア側にしきい値を置く場合だけ使う
  - name: paper
    feeds_opml: data/feeds_paper.opml
    likes_csv: data/likes_paper.csv
    output_rss: docs/recommended-paper.xml
    title: "Paper Feed (English)"
    description: "論文からおすすめフィードを生成"
    apply_threshold_on: "final_score" # "similarity" or "final_score"（後述）
    score_threshold: 0.150 # 最終スコア側にしきい値を置く場合だけ使う
    language: "ja"
    translation:
      enabled: true
      source_language: "en"
      target_language: "ja"

